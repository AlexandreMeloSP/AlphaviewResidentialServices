server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Headers de segurança para arquivos estáticos
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    autoindex off;

    charset utf-8;
    index index.php;

    client_max_body_size 10M;

    # Block dotfiles except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Explicit block for .env and .git at any path
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Vite build manifest: lido do disco pelo Laravel, mas não público via HTTP
    location = /alphaview/build/manifest.json {
        deny all;
        return 404;
    }
    location = /build/manifest.json {
        deny all;
        return 404;
    }

    # Storage: serve only avatars and service images, deny contracts and private
    location /storage/ {
        location ~* /storage/(contracts|contratos|private)/ {
            deny all;
        }
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ \.php$ {
            deny all;
        }
    }

    # When prefix is NOT stripped by reverse proxy: serve build assets directly
    location ^~ /alphaview/build/ {
        rewrite ^/alphaview/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # When prefix is NOT stripped by reverse proxy: serve storage files directly
    location ^~ /alphaview/storage/ {
        location ~* /alphaview/storage/(contracts|contratos|private)/ {
            deny all;
        }
        location ~ \.php$ {
            deny all;
        }
        rewrite ^/alphaview/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # When prefix is NOT stripped by reverse proxy: /alphaview/...
    location ^~ /alphaview/ {
        # Block .env and .git within prefix
        location ~* /alphaview/\.env {
            deny all;
            return 404;
        }
        location ~* /alphaview/\.git {
            deny all;
            return 404;
        }

        rewrite ^/alphaview(.*)$ $1 break;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri;
        fastcgi_param HTTPS $trusted_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    # When prefix IS stripped: serve React app for all non-API routes
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $trusted_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }
}
