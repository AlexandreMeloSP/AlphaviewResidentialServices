# Confia em X-Forwarded-* apenas de proxies internos (redes docker RFC1918).
#geo/map precisam viver no contexto http — este arquivo é incluído por conf.d/*.conf.
# $trusted_proto é consumido em fastcgi_param HTTPS pelo nginx-single.conf.

geo $trusted_proxy {
    default 0;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map $trusted_proxy $trusted_proto {
    default $scheme;
    1 $http_x_forwarded_proto;
}
