server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;
    root /var/www/html/public;

    # SSL (self-signed for dev, replace in production)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers handled by Dokploy reverse proxy (Nginx)
    # Do NOT add headers here to avoid duplicates

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Hide server version and PHP info
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    charset utf-8;
    index index.php;

    client_max_body_size 10M;

    # Block dotfiles except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Storage: serve only avatars and service images, deny contracts and private
    location /storage/ {
        location ~* /storage/(contracts|contratos|private)/ {
            deny all;
        }
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ \.php$ {
            deny all;
        }
    }

    # /alphaview/ prefix handling
    location ^~ /alphaview/ {
        rewrite ^/alphaview(.*)$ $1 break;

        fastcgi_pass alphaview-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri;
    }

    location ~ ^/(api|sanctum)/ {
        fastcgi_pass alphaview-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /favicon.ico { try_files /alphaview/favicon.ico =404; access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass alphaview-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
