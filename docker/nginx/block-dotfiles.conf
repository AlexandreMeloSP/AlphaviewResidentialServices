server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    charset utf-8;
    index index.php;
    client_max_body_size 10M;

    # Headers de segurança para arquivos estáticos
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # BLOQUEIO DE DOTFILES
    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location ~ /\.(?!well-known).* { deny all; return 404; }

    # Vite build manifest: lido do disco pelo Laravel, mas não público via HTTP
    location = /alphaview/build/manifest.json { deny all; return 404; }
    location = /build/manifest.json { deny all; return 404; }

    # Bloqueio adicional para /api/.env e /api/.git
    location ~ ^/api/\.env { deny all; return 404; }
    location ~ ^/api/\.git { deny all; return 404; }

    location /storage/ {
        location ~* /storage/(contracts|contratos|private)/ { deny all; }
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ \.php$ { deny all; }
    }

    location ^~ /alphaview/build/ {
        rewrite ^/alphaview/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /alphaview/storage/ {
        location ~* /alphaview/storage/(contracts|contratos|private)/ { deny all; }
        location ~ \.php$ { deny all; }
        rewrite ^/alphaview/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /alphaview/ {
        location ~* /alphaview/\.env { deny all; return 404; }
        location ~* /alphaview/\.git { deny all; return 404; }
        location ~* /alphaview/api/\.env { deny all; return 404; }
        location ~* /alphaview/api/\.git { deny all; return 404; }
        rewrite ^/alphaview(.*)$ $1 break;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri;
        fastcgi_param HTTPS $trusted_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 @notfound;

    location @notfound {
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><title>404</title></head><body><h1>404 - Não encontrado</h1></body></html>';
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $trusted_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }
}
