name: CI/CD Pipeline

on:
  push:
    branches: [app]
  pull_request:
    branches: [app]

jobs:
  ci:
    name: CI — Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Create .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Verify build output
        run: test -d public/build && echo "Build OK"

  deploy:
    name: Deploy to Production
    needs: ci
    if: github.ref == 'refs/heads/app' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Dokploy deployment
        run: |
          echo "Push to app branch detected."
          echo "Dokploy auto-deploys on git push."
          echo "Deployment triggered for commit ${{ github.sha }}"
